spring.application.name=ScienceKidBE
# allow up to 100MB uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

database.ip = ${POSTGRES_HOST:localhost}
database.port = ${POSTGRES_PORT:5432}
database.user = ${POSTGRES_USER:postgres}
database.password = ${POSTGRES_PASSWORD:root}
database.name = ${POSTGRES_DBNAME:science-kid}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

